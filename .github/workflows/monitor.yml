name: VION product monitor

on:
  schedule:
    # Testing cadence: every five minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Validate products.csv URLs without writing to Sheets or Slack'
        type: boolean
        default: true
      force:
        description: 'Skip the interval check for a normal run (ignored in probe mode)'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize all runs, including manual runs from other branches, to protect snapshots.
concurrency:
  group: vion-product-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      TEST_PRODUCT_LIMIT: '30'
      TEST_DISTINCT_BRANDS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Probe product URLs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python -m vion_monitor.probe

      - name: Upload probe report
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: vion-site-probe
          path: local-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Monitor products
        if: ${{ github.event_name == 'schedule' || !inputs.probe }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PRODUCT_SHEET_NAME: ${{ vars.PRODUCT_SHEET_NAME || '제품 데이터' }}
          # Scheduled test runs bypass the interval check.
          FORCE_RUN: ${{ (github.event_name == 'schedule' || inputs.force) && 'true' || 'false' }}
        shell: bash
        run: |
          set +e
          python -m vion_monitor
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::일부 제품 수집에 실패했습니다. 상세 내용은 Slack과 실행 로그를 확인하세요."
            exit 0
          fi
          exit "$status"
