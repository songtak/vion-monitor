name: VION scheduled product monitor

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize all runs, including manual runs from other branches, to protect snapshots.
concurrency:
  group: vion-product-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      TEST_PRODUCT_LIMIT: '30'
      TEST_DISTINCT_BRANDS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Monitor products
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PRODUCT_SHEET_NAME: ${{ vars.PRODUCT_SHEET_NAME || '제품 데이터' }}
          FORCE_RUN: 'true'
        shell: bash
        run: |
          set +e
          python -m vion_monitor
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::일부 제품 수집에 실패했습니다. 상세 내용은 Slack과 실행 로그를 확인하세요."
            exit 0
          fi
          exit "$status"
