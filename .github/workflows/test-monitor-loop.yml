name: VION 10-minute test loop
run-name: VION 10-minute fallback test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vion-product-monitor
  cancel-in-progress: false

jobs:
  monitor-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      TEST_PRODUCT_LIMIT: '30'
      TEST_DISTINCT_BRANDS: 'true'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PRODUCT_SHEET_NAME: ${{ vars.PRODUCT_SHEET_NAME || '제품 데이터' }}
      FORCE_RUN: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Monitor every ten minutes for one hour
        shell: bash
        run: |
          for cycle in 1 2 3 4 5 6; do
            started_at=$(date +%s)
            echo "::group::Monitor cycle $cycle of 6"
            set +e
            python -m vion_monitor
            status=$?
            set -e
            echo "::endgroup::"

            if [ "$status" -eq 1 ]; then
              exit 1
            fi
            if [ "$status" -eq 2 ]; then
              echo "::warning::Cycle $cycle completed with product-level collection errors."
            fi
            if [ "$cycle" -eq 6 ]; then
              break
            fi

            elapsed=$(( $(date +%s) - started_at ))
            remaining=$(( 600 - elapsed ))
            if [ "$remaining" -gt 0 ]; then
              echo "Next cycle starts in ${remaining} seconds."
              sleep "$remaining"
            fi
          done
