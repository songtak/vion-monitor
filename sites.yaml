# These are SITE-SPECIFIC rule profiles, not a claim that every field is available.
# Every profile is exercised per product; missing values are recorded as unavailable.
# CSS selectors are tried in order only inside a product page, not across sites.
sites:
  amoremall:
    domains: [amoremall.com]
    paths: [/kr/ko/product/detail]
    engine: custom
    name: ['h1', '[class*="productName"]', '[class*="goodsName"]']
  torriden:
    domains: [torriden.com]
    paths: [/goods/goods_view.php]
    engine: godomall
    name: ['.item_detail_tit h3', '.item_detail_tit', 'h1']
    regular_price: ['.item_detail_tit .prd_money_box del']
    ingredient_labels: ['주요성분']
  roundlab:
    domains: [roundlab.co.kr]
    paths: [/product/]
    engine: cafe24
  anua:
    domains: [anua.kr]
    paths: [/product/]
    engine: cafe24
  beplain:
    domains: [beplain.co.kr]
    paths: [/shop/, /index.html]
    engine: makeshop
    regular_price: ['.priceArea .consumer']
    base_price: ['.priceArea #pricevalue']
  abib:
    domains: [abib.com]
    paths: [/product/]
    engine: cafe24
    ingredients: ['.acco-inner .ingr2']
  naosmall:
    domains: [naosmall.kr]
    paths: [/product/]
    engine: cafe24
  isntree:
    domains: [isntree.com]
    paths: [/product/]
    engine: cafe24
  inyoe:
    domains: [inyoe.co.kr]
    paths: [/product/]
    engine: cafe24
  wellage:
    domains: [wellage.co.kr]
    paths: [/product/]
    engine: cafe24
    ingredients: ['.prod_ingredient']
  sidmool:
    domains: [sidmool.com]
    paths: [/shop/shopdetail.html]
    engine: makeshop
    base_price: ['.s-price']
  ybk:
    domains: [ybk-cosmetics.com]
    paths: [/product/]
    engine: cafe24
  tonymoly:
    domains: [tonymoly.com]
    paths: [/products/]
    engine: custom
    name: ['.prod-name']
    regular_price: ['.selling-price-wrap .price-before']
  snature:
    domains: [snature.kr]
    paths: [/product/]
    engine: cafe24
  vegreen:
    domains: [vegreen.co.kr]
    paths: [/product/]
    engine: cafe24
  blancdoux:
    domains: [blancdoux.com]
    paths: [/product/]
    engine: cafe24
  dr20project:
    domains: [dr20project.com]
    paths: [/product/]
    engine: cafe24
  manyo:
    domains: [manyo.co.kr]
    paths: [/goods/goods_view.php]
    engine: godomall
  laneige:
    domains: [laneige.com]
    paths: [/product/]
    engine: custom
    name: ['.pdp__name-main']
    ingredients: ['.pdp-ingredient__content-box']
    render: true
  numbuzin:
    domains: [numbuzin.com]
    paths: [/product/]
    engine: cafe24
  oliveyoung:
    domains: [oliveyoung.co.kr]
    paths: [/store/goods/getGoodsDetail.do]
    engine: custom
  ecominimal:
    domains: [ecominimal.co.kr]
    paths: [/product/]
    engine: cafe24
  lavien:
    domains: [lavien.co.kr]
    paths: [/product/]
    engine: cafe24
  leaderscosmetics:
    domains: [leaderscosmetics.com]
    paths: [/product/]
    engine: cafe24
  cosrx:
    domains: [cosrx.co.kr]
